<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — PTI Development</title>
  <meta name="description" content="Visit our Mirpur office or WhatsApp us anytime.">
  <meta name="theme-color" content="#06182C">
  <link rel="icon" href="assets/img/pti-logo-vertical.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<main>
  <section class="page-hero" data-theme="dark" data-floor="Say hello" style="min-height:78svh">
    <div class="bg"><img src="assets/img/skyline-up.webp" alt=""></div>
    <div class="wrap">
      <div class="crumbs" data-hero-in><a href="index.html">Home</a><span>/</span><span>Contact</span></div>
      <h1>Connect With<br>PTI Development<br><span class="serif">Today</span></h1>
      <p class="lead" data-hero-in>Visit our Mirpur office or WhatsApp us anytime.</p>
    </div>
  </section>

  <section class="section" data-theme="light" data-floor="Get in touch">
    <div class="wrap contact-grid">
      <div>
        <span class="eyebrow" data-reveal>Send a message</span>
        <h2 class="h2" data-split style="margin:20px 0 48px">Let's build<br>your <span class="serif">dream</span></h2>
        <form id="contact-form" class="form" novalidate data-reveal>
          <div class="field"><input id="f1" name="first" required placeholder=" " autocomplete="given-name"><label for="f1">First Name <em>*</em></label></div>
          <div class="field"><input id="f2" name="last" required placeholder=" " autocomplete="family-name"><label for="f2">Last Name <em>*</em></label></div>
          <div class="field"><input id="f3" name="email" type="email" required placeholder=" " autocomplete="email"><label for="f3">Email Address <em>*</em></label></div>
          <div class="field"><input id="f4" name="phone" type="tel" required placeholder=" " autocomplete="tel"><label for="f4">Phone <em>*</em></label></div>
          <div class="field full"><textarea id="f5" name="message" required placeholder=" "></textarea><label for="f5">Message <em>*</em></label></div>
          <div style="grid-column:1/-1"><button class="btn dark" type="submit" data-magnetic><span>Submit</span><span class="btn-ico"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 13L13 3M13 3H5M13 3V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></div>
          <p class="form-note" role="status"></p>
        </form>
      </div>
      <div class="contact-cards" data-render="contact-cards"></div>
    </div>
  </section>

  <section class="section" data-theme="white" data-floor="Find us">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow" data-reveal>Our office</span>
        <h2 class="h2" data-split>Pallabi, <span class="serif">Mirpur</span></h2>
      </div>
      <iframe class="map" title="PTI Development office map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Pallabi+Police+Station,+Mirpur,+Dhaka&amp;output=embed" data-reveal></iframe>
    </div>
  </section>

  <div data-render="cta"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/tower.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
